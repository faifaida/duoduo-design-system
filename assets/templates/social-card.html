<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUODUO Social Card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #e8dcc8; }
    body { display: grid; place-items: center; font-family: "Songti SC", STSong, serif; letter-spacing: 0; }
    .card { position: relative; width: 1080px; height: 1440px; overflow: hidden; color: #25262b; background: #f1e9da; }
    .photo { position: absolute; inset: 0 0 500px 0; width: 100%; height: 940px; object-fit: cover; }
    .wash { position: absolute; inset: 700px 0 auto; height: 350px; background: rgba(241,233,218,.9); }
    .route { position: absolute; top: 86px; right: 82px; width: 190px; height: 190px; border: 2px solid rgba(250,246,238,.72); border-radius: 50%; }
    .route::before, .route::after { content: ""; position: absolute; border: 2px solid rgba(31,206,221,.72); border-radius: 50%; }
    .route::before { inset: 28px; }
    .route::after { inset: 66px; background: rgba(21,26,46,.3); }
    .content { position: absolute; inset: auto 76px 72px; }
    .kicker { margin: 0 0 22px; color: #00b6c5; font: 700 24px/1.4 ui-monospace, monospace; }
    h1 { max-width: 880px; margin: 0; color: #25262b; font: 500 70px/1.2 "Songti SC", STSong, serif; }
    .sub { max-width: 790px; margin: 28px 0 0; color: #6b3a3a; font-size: 30px; line-height: 1.65; }
    .meta { display: flex; justify-content: space-between; align-items: end; margin-top: 46px; padding-top: 26px; border-top: 2px solid rgba(138,106,74,.38); }
    .brand-lockup { display: flex; align-items: center; gap: 14px; color: #2e27a8; }
    .brand-lockup img { width: 42px; height: 58px; object-fit: cover; }
    .brand-lockup b { display: block; font: 700 28px/1 Baskerville, "Iowan Old Style", "Times New Roman", serif; }
    .brand-lockup small { display: block; margin-top: 6px; color: #8a6a4a; font: 600 13px/1.2 "Songti SC", STSong, serif; }
    .meta span { color: #8a6a4a; font: 700 20px/1.4 ui-monospace, monospace; }
  </style>
</head>
<body>
  <article class="card">
    <img class="photo" src="../site-media/public/photos/surf-yoga-beach.jpeg" alt="真实海边生活照片">
    <div class="wash"></div>
    <div class="route" aria-hidden="true"></div>
    <div class="content">
      <p class="kicker">UNFINISHED EXPERIMENT 01</p>
      <h1>自由不是没有根，而是把根长在可以随身携带的地方。</h1>
      <p class="sub">一个关于海、身体、真实工作与长期生活设计的笔记。</p>
      <div class="meta"><div class="brand-lockup"><img src="../brand/current/duoduo-symbol.png" alt=""><div><b>DUODUO</b><small>多多的未完成实验</small></div></div><span>01 / 06</span></div>
    </div>
  </article>
</body>
</html>
