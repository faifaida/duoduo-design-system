<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUODUO Brand Poster</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #151a2e; }
    body { display: grid; place-items: center; font-family: "Songti SC", STSong, serif; letter-spacing: 0; }
    .poster { position: relative; width: 1080px; height: 1440px; overflow: hidden; color: #f1e9da; background: #151a2e url("../site-media/public/ocean/duoduo-living-ocean.png") center/cover; }
    .poster::before { content: ""; position: absolute; inset: 0; background: rgba(8,16,31,.68); }
    .frame { position: absolute; inset: 52px; border: 2px solid rgba(31,206,221,.52); }
    .brand { position: absolute; top: 82px; left: 82px; display: flex; align-items: center; gap: 14px; color: #2e27a8; background: #f1e9da; padding: 14px 18px; }
    .brand img { width: 38px; height: 53px; object-fit: cover; }
    .brand b { display: block; font: 700 27px/1 Baskerville, "Iowan Old Style", "Times New Roman", serif; }
    .brand small { display: block; margin-top: 5px; color: #8a6a4a; font: 600 11px/1.2 "Songti SC", STSong, serif; }
    .star { position: absolute; width: 14px; height: 14px; border: 2px solid #1fcedd; transform: rotate(45deg); }
    .star.one { top: 260px; right: 150px; }
    .star.two { top: 400px; right: 310px; width: 8px; height: 8px; }
    .star.three { bottom: 300px; left: 135px; width: 10px; height: 10px; border-color: #c99a3f; }
    .copy { position: absolute; left: 82px; right: 82px; bottom: 112px; }
    .kicker { margin: 0 0 28px; color: #1fcedd; font: 700 22px/1.4 ui-monospace, monospace; }
    h1 { max-width: 860px; margin: 0; color: #f1e9da; font: 400 88px/1.15 "Iowan Old Style", Baskerville, serif; }
    h1 em { color: #1fcedd; font-style: normal; }
    .zh { max-width: 720px; margin: 30px 0 0; color: #f1e9da; font-size: 34px; line-height: 1.65; }
    .foot { display: flex; justify-content: space-between; margin-top: 62px; padding-top: 26px; border-top: 1px solid rgba(241,233,218,.38); color: #c99a3f; font: 700 20px/1.4 ui-monospace, monospace; }
  </style>
</head>
<body>
  <article class="poster">
    <div class="frame"></div>
    <div class="brand"><img src="../brand/current/duoduo-symbol.png" alt=""><div><b>DUODUO</b><small>多多的个人世界</small></div></div>
    <i class="star one"></i><i class="star two"></i><i class="star three"></i>
    <div class="copy">
      <p class="kicker">WAVES · PLACES · PEOPLE · EXPERIMENTS</p>
      <h1>A life made of <em>waves</em>, places, people and unfinished experiments.</h1>
      <p class="zh">一个由浪、地方、人与未完成实验组成的人生。</p>
      <div class="foot"><span>FAIFAIDA.COM</span><span>DUODUO / 多多</span></div>
    </div>
  </article>
</body>
</html>
