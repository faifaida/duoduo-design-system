name: Deploy faifaida.com

on:
  push:
    branches: [main]
    paths:
      - "assets/faifaida-reference/**"
      - "assets/site-media/public/**"
      - ".github/workflows/deploy-faifaida.yml"
  workflow_dispatch:

concurrency:
  group: faifaida-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/faifaida-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/faifaida-reference/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy to Cloudflare
        shell: bash
        run: |
          cloudflare_token="$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | grep -oE '[A-Za-z0-9._-]{20,}' | tail -n 1 || true)"
          cloudflare_account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | grep -oE '[A-Fa-f0-9]{32}' | tail -n 1 || true)"

          if [[ -z "$cloudflare_token" || -z "$cloudflare_account_id" ]]; then
            echo "Cloudflare credentials are present but could not be normalized."
            exit 1
          fi

          export CLOUDFLARE_API_TOKEN="$cloudflare_token"
          export CLOUDFLARE_ACCOUNT_ID="$cloudflare_account_id"
          npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
