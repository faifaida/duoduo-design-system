name: Deploy faifaida.com

on:
  push:
    branches: [main]
    paths:
      - "assets/faifaida-reference/**"
      - "assets/site-media/public/**"
      - ".github/workflows/deploy-faifaida.yml"
  workflow_dispatch:

concurrency:
  group: faifaida-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/faifaida-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/faifaida-reference/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy to Cloudflare
        shell: bash
        run: |
          oidc_response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=faifaida-deploy")"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          credential_response="$(curl -fsS -X POST https://faifaida.com/api/github-deploy-credential -H "Authorization: Bearer $oidc_token")"
          cloudflare_token="$(jq -r '.token // empty' <<<"$credential_response")"
          cloudflare_account_id="$(grep -oE 'account_id[[:space:]]*=[[:space:]]*"[A-Fa-f0-9]{32}"' wrangler.toml | grep -oE '[A-Fa-f0-9]{32}' | head -n 1)"

          if [[ -z "$cloudflare_token" || -z "$cloudflare_account_id" ]]; then
            echo "GitHub OIDC identity exchange did not return deploy credentials."
            exit 1
          fi

          echo "::add-mask::$cloudflare_token"
          export CLOUDFLARE_API_TOKEN="$cloudflare_token"
          export CLOUDFLARE_ACCOUNT_ID="$cloudflare_account_id"
          npm run build:cloudflare

          # The custom domains are already attached to duoduo-os. This token may
          # update the Worker but intentionally cannot edit zone routes, so keep
          # the existing routes and deploy only the generated Worker config.
          jq 'del(.routes)' dist/server/wrangler.json > dist/server/wrangler-ci.json
          npx wrangler deploy --config dist/server/wrangler-ci.json
